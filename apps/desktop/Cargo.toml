[package]
name = "bible-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The shared shell is a library so mobile can link against it. The desktop
# `main` binary and the iOS/Android hosts all call `bible_desktop_lib::run`.
# `staticlib` is iOS, `cdylib` is Android, `rlib` is the desktop binary.
[lib]
name = "bible_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bible-app-core.workspace = true
bible-storage.workspace = true
bible-versification.workspace = true
tauri = { version = "2", features = [] }
serde = { workspace = true }
